# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: aws-transfer-family
    name: AWS Transfer Family
    description: Managed SFTP server that accepts files from Infor ION and stores them in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/aws-transfer-family/
    types: [managed-service]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Object storage for files transferred from InforOS and read by example consumers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sqs
    name: Amazon Simple Queue Service
    description: Optional target for Amazon S3 object-created event notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sqs/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Optional target for Amazon S3 object-created event notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Optional target for Amazon S3 object-created event notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Example consumer that reads data from Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-emr
    name: Amazon EMR
    description: Example data consumer shown within a VPC.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/emr/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2
    name: Amazon Elastic Compute Cloud
    description: Example data consumer shown within a VPC and accessing Amazon S3 through AWS PrivateLink.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-vpc
    name: Amazon Virtual Private Cloud
    description: The VPC containing the example Amazon EC2 and Amazon EMR consumers and AWS PrivateLink endpoint.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-privatelink
    name: AWS PrivateLink
    description: Private connectivity shown between the VPC example consumers and Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/privatelink/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
