# Technologies named by the AWS Connected Home Telemetry reference architecture.
technologies:
  - key: aws-iot-core
    name: AWS IoT Core
    description: Connects devices and routes telemetry to downstream services through topic rules.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Optional edge path through which connected home devices send telemetry to AWS IoT Core; the reference does not specify the Greengrass deployment.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/greengrass/
    types: [compute-platform]
    platform: other
    hosts: [system]
  - key: freertos
    name: FreeRTOS
    description: Device operating system used in the direct MQTT connection path shown by the reference architecture.
    vendor: Amazon Web Services
    url: https://www.freertos.org/
    types: [compute-platform]
    platform: other
    hosts: [system]
  - key: aws-iot-device-sdk
    name: AWS IoT Device SDK
    description: Device SDKs shown with connected home devices; the reference does not identify a particular SDK or version.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-device-sdk/
    types: [library]
  - key: mqtt
    name: MQTT
    description: Messaging protocol used by FreeRTOS devices to connect directly to AWS IoT Core.
    vendor: OASIS
    url: https://mqtt.org/
    types: [third-party]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores meaningful telemetry selected by an AWS IoT Core topic rule and is read by an AWS Lambda function for client requests.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-events
    name: AWS IoT Events
    description: Detects conditions in telemetry routed from AWS IoT Core, such as a temperature threshold being exceeded.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-events/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-analytics
    name: AWS IoT Analytics
    description: Ingests telemetry directly from AWS IoT Greengrass for analysis and subsequent visualization.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-analytics/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Receives telemetry retrieval requests from client applications and invokes an AWS Lambda function.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the function invoked by API Gateway to retrieve requested data from DynamoDB.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Delivers notifications triggered by AWS IoT Events when specified telemetry conditions occur.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes data imported from AWS IoT Analytics for client applications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
