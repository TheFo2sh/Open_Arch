# Technologies used by the blueprint, keyed by its metadata { uses } values.
technologies:
  - key: aws-glue-crawler
    name: AWS Glue Crawler
    description: Captures source metadata for the AWS Glue Data Catalog.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/glue/latest/dg/add-crawler.html
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Stores catalog metadata discovered by the AWS Glue Crawler for batch preparation.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue-databrew
    name: AWS Glue DataBrew
    description: Cleans and normalizes batch transaction, product, and consumer data for analytics and machine learning.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/features/databrew/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Receives real-time clickstream events and exposes the recommendation serving layer to web and mobile channels.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Captures real-time clickstream events for downstream persistence and Amazon Personalize updates.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-data-firehose
    name: Amazon Data Firehose
    description: Loads streamed event data into Amazon S3 for potential model retraining and future use.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the event-forwarding, recommendation-serving, and campaign-integration functions shown in the architecture.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-s3
    name: Amazon S3
    description: Persists prepared training inputs and streamed event data for future use.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-personalize
    name: Amazon Personalize
    description: Uses interactions, items, and users data to produce recommendations and incorporates recent consumer activity.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/personalize/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-pinpoint
    name: Amazon Pinpoint
    description: Delivers targeted consumer notifications informed by predictive recommendations.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/pinpoint/
    types: [managed-service]
    platform: aws
    hosts: []
