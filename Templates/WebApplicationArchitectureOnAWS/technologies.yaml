# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-route-53
    name: Amazon Route 53
    description: DNS service that resolves the web application's domain to its endpoints.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/route53/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-cloudfront
    name: Amazon CloudFront
    description: Content delivery network that reduces latency when delivering static content and forwards web requests.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudfront/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Object storage for static website content and backups.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-waf
    name: AWS WAF
    description: Web application firewall that protects the application from common web exploits.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/waf/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-certificate-manager
    name: AWS Certificate Manager
    description: Manages SSL/TLS certificates used to secure web access.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/certificate-manager/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: Application Load Balancers distribute incoming web and application traffic across Availability Zones.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2-auto-scaling
    name: Amazon EC2 Auto Scaling
    description: EC2 compute platform for web and application servers across multiple Availability Zones.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/autoscaling/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-vpc-nat-gateway
    name: Amazon VPC NAT gateway
    description: Enables EC2 instances in private subnets to access the internet through NAT gateways in public subnets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-rds
    name: Amazon Relational Database Service
    description: Managed relational database service for the application's database tier.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-elasticache
    name: Amazon ElastiCache
    description: Optional managed caching service for applications with read-heavy database access patterns.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticache/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-efs
    name: Amazon Elastic File System
    description: Optional shared file system for web and application servers that access shared files.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/efs/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
