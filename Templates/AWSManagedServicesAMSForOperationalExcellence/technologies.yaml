# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: aws-managed-services
    name: AWS Managed Services (AMS)
    description: Managed operations service providing 24x7 helpdesk, proactive monitoring, security operations, logging, patching, and backup capabilities.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/managed-services/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-support
    name: AWS Support
    description: AWS Support console and APIs receive incidents and service requests and return AMS updates and resolutions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/premiumsupport/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-service-management-connector
    name: AWS Service Management Connector
    description: Optional integration between customer ITSM tooling and AWS Support; the AMS diagram labels the connector AWS Service Catalog Management Connectors.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/solutions/implementations/aws-service-management-connector/
    types: [library]
  - key: servicenow
    name: ServiceNow
    description: Optional third-party ITSM platform that can integrate with AWS Support through the AWS Service Management Connector.
    vendor: ServiceNow
    url: https://www.servicenow.com/
    types: [third-party]
  - key: jira-service-desk
    name: Jira Service Desk
    description: Optional third-party ITSM platform, identified as Jira SD in the AWS source, that can integrate with AWS Support through the AWS Service Management Connector.
    vendor: Atlassian
    url: https://www.atlassian.com/software/jira/service-management
    types: [third-party]
  - key: amazon-vpc
    name: Amazon Virtual Private Cloud (Amazon VPC)
    description: VPC boundaries are shown for application, AMS orchestration, security, and logging accounts; the source does not specify their network design.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-ec2
    name: Amazon Elastic Compute Cloud (Amazon EC2)
    description: AWS compute resources monitored by AMS and included among the services covered by patching and backup.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-rds
    name: Amazon Relational Database Service (Amazon RDS)
    description: AWS database service included in AMS baseline monitoring.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: AWS load-balancing service included in AMS baseline monitoring.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-vpn
    name: AWS VPN
    description: VPN service included in AMS baseline monitoring.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpn/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-vpc-nat-gateway
    name: NAT Gateway
    description: Amazon VPC NAT Gateway included in AMS baseline monitoring.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: AWS storage service monitored for security guardrails and included among AMS security operations targets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-iam
    name: AWS Identity and Access Management (IAM)
    description: AWS identity service monitored for security guardrails.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iam/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-eks
    name: Amazon Elastic Kubernetes Service (Amazon EKS)
    description: AWS Kubernetes service monitored for security guardrails.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eks/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-ebs
    name: Amazon Elastic Block Store (Amazon EBS)
    description: EC2 block storage shown among the resources covered by AMS backup.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ebs/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-efs
    name: Amazon Elastic File System (Amazon EFS)
    description: AWS file system shown among the resources covered by AMS backup.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/efs/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: AMS uses CloudWatch metrics, alarms, rules, events, dashboards, and Logs for monitoring, alerting, and local log search.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-cloudwatch-agent
