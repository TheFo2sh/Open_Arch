# The technologies the blueprint uses, by the key its metadata { uses } names them by.
technologies:
  - key: amazon-kinesis-video-streams
    name: Amazon Kinesis Video Streams
    description: Ingests live video from IoT-enabled cameras and supplies the feed to the user application.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/video-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-kinesis-video-streams-producer-libraries
    name: Amazon Kinesis Video Streams Producer Libraries
    description: Libraries used by cameras to generate and publish video feeds to Kinesis Video Streams.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/kinesisvideostreams/latest/dg/
    types: [library]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores image frames extracted from the live video feed.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs a function in response to an Amazon S3 write event and sends the image to Amazon Rekognition.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: []
  - key: amazon-rekognition
    name: Amazon Rekognition
    description: Analyzes uploaded images to generate machine-learning inference.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rekognition/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores machine-learning inference and its metadata for retrieval by the user application.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-eks
    name: Amazon Elastic Kubernetes Service
    description: Managed Kubernetes platform that runs the user and admin applications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eks/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Exposes the video-feed and machine-learning inference APIs to end users.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: Stores logs and metrics from the complete stack.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cognito
    name: Amazon Cognito
    description: Secures the API feed exposed through Amazon API Gateway.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cognito/
    types: [managed-service]
    platform: aws
    hosts: []
