# Technologies named in the AWS reference architecture and its flow.
technologies:
  - key: github
    name: GitHub
    description: Third-party Git provider whose pull request webhooks can trigger CodeBuild and receive CI status updates.
    vendor: GitHub
    url: https://github.com/
    types: [third-party]
  - key: bitbucket
    name: Bitbucket
    description: Third-party Git provider whose pull request webhooks can trigger CodeBuild and receive CI status updates.
    vendor: Atlassian
    url: https://bitbucket.org/
    types: [third-party]
  - key: aws-codecommit
    name: AWS CodeCommit
    description: AWS-hosted Git source alternative whose pull request events use a Lambda trigger.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codecommit/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codebuild
    name: AWS CodeBuild
    description: Receives pull request triggers, archives pull request source, and supports CI build and test work.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codebuild/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the CodeCommit trigger, queued pull request consumer, and CI status reporter functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Holds the Git Artifacts archive and the separate Pipeline Source used by CI.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-sqs
    name: Amazon Simple Queue Service
    description: Buffers ready pull request work until the consuming Lambda starts CI.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sqs/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Coordinates CI validation, unit tests, artifact build, preview environment creation, and integration/end-to-end tests.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-eventbridge
    name: Amazon EventBridge
    description: Tracks CI stage changes and routes them to the status reporting function.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eventbridge/
    types: [managed-service]
    platform: aws
    hosts: []
