# The technologies the blueprint uses, by the key its metadata { uses } names them by.
technologies:
  - key: aws-ground-station
    name: AWS Ground Station
    description: Provides antenna control, contact scheduling, and demodulation or error correction for satellite data delivered to Amazon EC2 as baseband or digitized RF-over-IP.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ground-station/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-ec2
    name: Amazon EC2
    description: Instance that receives and processes Ground Station data before storing imagery in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores ingested satellite imagery and labeled imagery used to prepare and train machine-learning models.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-sagemaker-ground-truth
    name: Amazon SageMaker Ground Truth
    description: Labels satellite images and returns labeled imagery for storage in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/groundtruth/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Runs the training algorithm, trains the machine-learning model, and hosts model inference endpoints.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs a function automatically triggered by new satellite image data in Amazon S3 to invoke machine-learning processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores inference results and metadata generated by the SageMaker model endpoint.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-amplify
    name: AWS Amplify
    description: Provides the application path for accessing the machine-learning algorithm and inference database.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/amplify/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: jupyter-notebook
    name: Jupyter Notebook
    description: Notebook environment used to prepare satellite imagery for training and hold the training algorithm and code; its hosting environment is unspecified.
    vendor: Project Jupyter
    url: https://jupyter.org/
    types: [third-party]
