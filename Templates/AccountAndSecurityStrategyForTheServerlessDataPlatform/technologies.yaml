# Technologies named in the AWS reference page and its diagram.
# Generic third-party entries preserve the categories shown; AWS does not select vendors.
technologies:
  - key: aws-control-tower
    name: AWS Control Tower
    description: Sets up and governs the multi-account AWS environment from the master account.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/controltower/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-organizations
    name: AWS Organizations
    description: Organizes the platform's AWS accounts under centralized governance.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/organizations/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iam
    name: AWS Identity and Access Management
    description: Controls identities, roles, and permissions for AWS resources.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iam/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-vpc
    name: Amazon Virtual Private Cloud
    description: Provides isolated virtual networks for account workloads.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-transit-gateway
    name: AWS Transit Gateway
    description: Connects VPCs and shared network connections across accounts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/transit-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-direct-connect
    name: AWS Direct Connect
    description: Provides dedicated connectivity from on-premises networks to AWS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/directconnect/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: third-party-identity-provider
    name: Third-party identity provider
    description: Identity provider category shown in the diagram; Okta and Ping Identity are examples, not requirements.
    vendor: Third party
    types: [third-party]
  - key: aws-iam-identity-center
    name: AWS IAM Identity Center
    description: Centralizes workforce access across AWS accounts; the source diagram calls this AWS Single Sign-On.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iam/identity-center/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: aws-security-hub
    name: AWS Security Hub
    description: Aggregates security findings to maintain visibility of the multi-account security posture.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/security-hub/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-guardduty
    name: Amazon GuardDuty
    description: Detects threats and suspicious activity across AWS accounts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/guardduty/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-cloudtrail
    name: AWS CloudTrail
    description: Records account activity for security analysis and auditing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudtrail/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudwatch-logs
    name: Amazon CloudWatch Logs
    description: Centralizes and monitors log data for account activity and auditing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-macie
    name: Amazon Macie
    description: Discovers and helps protect sensitive data stored in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/macie/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-kms
    name: AWS Key Management Service
    description: Creates and controls cryptographic keys used to protect AWS resources.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kms/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: third-party-casb
    name: Third-party cloud access security broker
    description: CASB category shown in the diagram; McAfee and Cloudflare are examples, not requirements.
    vendor: Third party
    types: [third-party]
  - key: aws-transfer-family
    name: AWS Transfer Family
    description: Provides the SFTP endpoint shown as AWS SFTP for batch data ingestion.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/aws-transfer-family/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Exposes managed APIs for data exchange and API management.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores API data for the ingestion and production workloads.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Ingests real-time data events into the data platform.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-firehose
    name: Amazon Data Firehose
    description: Delivers streaming data to destinations such as Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores batch staging, data lake, log, backup, and sandbox datasets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestrates the data processing workflows shown in the ingestion account.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs serverless functions used by ingestion and data processing workflows.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-ecs
    name: Amazon Elastic Container Service
    description: Runs containerized applications in the analytics production account.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ecs/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-glue
    name: AWS Glue
    description: Performs managed data integration and transformation for the data platform.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Maintains metadata for data repositories used by analytics services.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-emr
    name: Amazon EMR
    description: Transforms and processes data for production and sandbox analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/emr/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-athena
    name: Amazon Athena
    description: Queries data in Amazon S3, including through the shared data services.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: aws-lake-formation
    name: AWS Lake Formation
    description: Governs access to the data lake repositories across accounts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lake-formation/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-redshift
    name: Amazon Redshift
    description: Provides data warehouse and Spectrum query access to Amazon S3 data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-sagemaker
    name: Amazon SageMaker
    description: Supports notebook development, model training and monitoring, and production model deployment.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Presents dashboards and reports to data consumers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: third-party-bi-tools
    name: Third-party dashboard and BI tools
    description: Customer-selected dashboard tools shown as an alternative to Amazon QuickSight; vendors are not specified.
    vendor: Third party
    types: [third-party]
  - key: amazon-route-53
    name: Amazon Route 53
    description: Provides DNS management as a shared service for the accounts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/route53/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-directory-service
    name: AWS Directory Service
    description: Provides managed directory capabilities in the shared services account.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/directoryservice/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: third-party-shared-services
    name: Third-party shared services
    description: Unspecified third-party tools shown in the shared services account; AWS does not name products.
    vendor: Third party
    types: [third-party]
  - key: aws-codepipeline
    name: AWS CodePipeline
    description: Orchestrates deployments of code and artifacts to ingestion and analytics accounts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codepipeline/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-codecommit
    name: AWS CodeCommit
    description: Hosts source repositories for the diagram's DevOps workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codecommit/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codebuild
    name: AWS CodeBuild
    description: Builds the artifacts used by the DevOps deployment workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codebuild/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codedeploy
    name: AWS CodeDeploy
    description: Deploys code and artifacts to supported ingestion and analytics workloads.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codedeploy/
    types: [managed-service]
    platform: aws
    hosts: []
