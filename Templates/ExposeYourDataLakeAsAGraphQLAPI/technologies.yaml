technologies:
  - key: aws-lake-formation
    name: AWS Lake Formation
    description: Data lake governance service used to set up and govern access to the data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lake-formation/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon S3
    description: Object storage for the data lake and Athena query results.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue
    name: AWS Glue
    description: Data integration service whose crawlers catalog data stored in the lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: Monitors AWS Glue Data Catalog changes and triggers schema updates.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the catalog-change schema generator and GraphQL query resolvers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-codecommit
    name: AWS CodeCommit
    description: Source control repository for the schema and resolver code generated from the catalog.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codecommit/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codepipeline
    name: AWS CodePipeline
    description: Starts the CI/CD pipeline when generated source code is committed.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codepipeline/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codebuild
    name: AWS CodeBuild
    description: Builds the generated source code into a new version of the API.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codebuild/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-codedeploy
    name: AWS CodeDeploy
    description: Deploys the new AppSync API and Lambda query resolvers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/codedeploy/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-appsync
    name: AWS AppSync
    description: Managed GraphQL API service that serves client queries over HTTPS and provides server-side caching.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/appsync/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-athena
    name: Amazon Athena
    description: SQL query service used by Lambda resolvers to query the data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: athena-express
    name: athena-express
    description: Node.js library used to run Athena jobs synchronously from Lambda resolvers.
    url: https://www.npmjs.com/package/athena-express
    types: [library]
    packages: [{manager: npm, name: athena-express}]
