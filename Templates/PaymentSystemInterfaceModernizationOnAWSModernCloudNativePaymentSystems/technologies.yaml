# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: aws-direct-connect
    name: AWS Direct Connect
    description: Private network connection between the bank data center and AWS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/directconnect/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-waf
    name: AWS WAF
    description: Web application firewall that filters internet requests before they reach the payment API.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/waf/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Receives internet payment requests and routes them toward the services in the VPC.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-vpc-endpoint
    name: Amazon VPC endpoint
    description: Private endpoint used by API Gateway to reach the payment services through a Network Load Balancer.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: Network Load Balancer and Application Load Balancer used along the request path into EKS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-eks
    name: Amazon Elastic Kubernetes Service
    description: Managed Kubernetes platform running the payment interface microservices and ingress controller.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eks/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-rds
    name: Amazon Relational Database Service
    description: Relational database service hosting the unified payment interface database and its read replica.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-elasticache-redis-oss
    name: Amazon ElastiCache (Redis OSS)
    description: Redis OSS session store used by payment interface services.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticache/redis/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-msk
    name: Amazon Managed Streaming for Apache Kafka
    description: Managed Kafka service whose topics carry events between payment interface microservices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/msk/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-opensearch-service
    name: Amazon OpenSearch Service
    description: Managed search and analytics service used for microservices observability.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/opensearch-service/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: AWS observability service used to monitor the payment interface microservices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iam
    name: AWS Identity and Access Management
    description: Role-based access control for payment interface resources.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iam/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-kms
    name: AWS Key Management Service
    description: Key management for securing credentials and data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kms/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-secrets-manager
    name: AWS Secrets Manager
    description: Managed storage and retrieval of credentials used by the payment interface.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/secrets-manager/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ecr
    name: Amazon Elastic Container Registry
    description: Container image registry for the payment interface microservices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ecr/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
