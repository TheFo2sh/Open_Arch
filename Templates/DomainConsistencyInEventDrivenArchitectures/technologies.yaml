# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# The relational database product is intentionally unspecified by the source notes.
technologies:
  - key: relational-database-unspecified
    name: Relational database (engine unspecified)
    description: Abstract relational data platform for the monolith's entity and transactional outbox tables; AWS does not specify a database product or engine.
    types: [data-platform]
    platform: aws
    hosts: [database]
  - key: aws-dms
    name: AWS Database Migration Service
    description: Captures relational database changes and sends CDC records to Kinesis Data Streams.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dms/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Carries relational database change records from DMS to the outbox publisher.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the outbox publisher functions and the bounded-context event consumer.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestration shown in the bounded-context microservice portion of the reference diagram; workflow details are not specified.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-fargate
    name: AWS Fargate
    description: Container compute shown in the bounded-context microservice portion of the reference diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/fargate/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-eventbridge
    name: Amazon EventBridge
    description: Custom event bus that receives published domain events and routes them with rules.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eventbridge/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sqs
    name: Amazon SQS
    description: Per-bounded-context event queues and dead-letter queues for failed message processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sqs/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores each microservice's entity and outbox tables and locally readable projections of external domains.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb-streams
    name: Amazon DynamoDB Streams
    description: Captures new DynamoDB outbox records and invokes the outbox publisher path.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
