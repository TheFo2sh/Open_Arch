# Technologies named in the AWS page and diagram, keyed as architecture.c4 metadata { uses } refers to them.
technologies:
  - key: amazon-connect
    name: Amazon Connect
    description: Cloud contact center used for airline customer service, skills-based routing, and workflows.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/connect/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-lex
    name: Amazon Lex
    description: Conversational chatbot service for customer interactions and data-platform access through Lambda.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lex/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Integrates Amazon Connect and Lex with the airline data platform and runs customer-event and API microservice functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-transcribe
    name: Amazon Transcribe
    description: Supports sentiment analysis of customer interactions, as stated in the AWS page.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/transcribe/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-comprehend
    name: Amazon Comprehend
    description: Supports sentiment analysis and customer-intent identification, as stated in the AWS page.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/comprehend/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Carries data events and MDM events in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-data-firehose
    name: Amazon Data Firehose
    description: Delivers streamed data events to the S3 data platform; the diagram calls it Amazon Kinesis Data Firehose.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores staging, Parquet, reportable, and interaction data sets shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue
    name: AWS Glue
    description: Data integration service shown with the S3 data sets and Glue Data Catalog.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Catalogs the data platform's data sets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-emr
    name: Amazon EMR
    description: Managed data-processing platform shown alongside AWS Glue.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/emr/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-redshift
    name: Amazon Redshift
    description: Stores customer data marts for customer analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Provides customer analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Provides customer analytics and machine-learning capabilities shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/ai/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-athena
    name: Amazon Athena
    description: Query service shown with the S3 data platform.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-personalize
    name: Amazon Personalize
    description: Personalization service shown with customer analytics and interaction data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/personalize/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-pinpoint
    name: Amazon Pinpoint
    description: Supports customer notifications and has interaction data shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/pinpoint/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestrates the customer-event and complex-event processing workflows shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores Customer 360 data; the diagram also shows DynamoDB Streams.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Provides the API entry point to Lambda microservices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: world-tracer
    name: World Tracer
    description: Third-party user interface integrated with the Amazon Connect Contact Control Panel; AWS does not identify its provider or integration details.
    types: [third-party]
  - key: net-tracer
    name: Net Tracer
    description: Third-party user interface shown with World Tracer in the diagram; AWS does not identify its provider or integration details.
    types: [third-party]
  - key: master-data-management
    name: Master data management
    description: Optional third-party MDM integration that provides a unified traveler profile; AWS does not specify a product or vendor.
    types: [third-party]
