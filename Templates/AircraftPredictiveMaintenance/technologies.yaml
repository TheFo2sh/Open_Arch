# The technologies named by metadata { uses } in the blueprint.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Streams aircraft fault logs, QAR events, flight events, and predictive maintenance events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-firehose
    name: Amazon Kinesis Data Firehose
    description: Delivers streamed aircraft and flight data to Amazon S3 staging storage.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs serverless functions, including the QAR identity-removal processing and predictive maintenance API functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-s3
    name: Amazon S3
    description: Stores restricted and processed staging data, aircraft data, and predictive maintenance data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue
    name: AWS Glue
    description: Transforms staged aircraft data and removes identifying information from QAR batch data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Catalogs aircraft and turn data for AWS analytics services.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores aircraft data used by the predictive maintenance application.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-emr
    name: Amazon EMR
    description: Processes aircraft and flight data for turn analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/emr/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-redshift
    name: Amazon Redshift
    description: Stores turn data for analytics and reporting.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-athena
    name: Amazon Athena
    description: Queries aircraft data for analytics and model tuning.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Trains and periodically tunes predictive maintenance models using aircraft fault, QAR, maintenance, and flight data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/ai/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Provides the API entry point for the predictive maintenance application and dashboard.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Provides turn analytics shown in the reference architecture.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: sita-arinc-acars
    name: SITA/ARINC ACARS source
    description: The external ACARS source label shown in the AWS diagram; the source does not specify its interface or implementation.
    vendor: SITA/ARINC
    types: [third-party]
