technologies:
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores the website and configuration files for the unified customer-engagement interface.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudfront
    name: Amazon CloudFront
    description: Serves the unified customer-engagement interface.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudfront/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cognito
    name: Amazon Cognito
    description: Controls access to the customer-engagement APIs.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cognito/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Provides APIs through which the application obtains personalized traveler recommendations and data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs functions that provide personalized recommendations for travelers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores Traveler 360 data, personalization workload outputs, and data collected from systems of record.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-lex
    name: Amazon Lex
    description: Powers a chatbot that gathers traveler input and automates personalized interactions and recommendations.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lex/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-opensearch-service
    name: Amazon OpenSearch Service
    description: Searches the product index for available products to recommend.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/opensearch-service/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-pinpoint
    name: Amazon Pinpoint
    description: Schedules mail or mobile push notifications containing traveler recommendations.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/pinpoint/
    types: [managed-service]
    platform: aws
    hosts: []
