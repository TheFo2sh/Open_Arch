# The technologies the blueprint uses, by the key its metadata { uses } names them by.
technologies:
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Edge runtime that provides local processing, device management, and secure connectivity for the on-premises gateway.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/greengrass/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs device-metadata operations in the cloud and local processing functions on the Greengrass edge gateway.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: docker
    name: Docker
    description: Container runtime used by AWS IoT Greengrass for custom edge applications.
    vendor: Docker
    url: https://www.docker.com/
    types: [compute-platform]
    platform: other
    hosts: [system]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Secure API endpoint invoked by AWS IoT Greengrass for device provisioning, AWS service access, and third-party API calls.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cognito
    name: Amazon Cognito
    description: Provides user authentication and authorization for the connected-device solution.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cognito/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iam
    name: AWS Identity and Access Management (IAM)
    description: Provides identity and access management for AWS service access.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iam/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-core
    name: AWS IoT Core
    description: Handles cloud-based device provisioning and receives telemetry from AWS IoT Greengrass and directly connected devices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis
    name: Amazon Kinesis
    description: Receives streaming video from medical devices in the AWS Cloud.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores metadata for medical devices and links it to device data and video insights.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Stores video, procedure-generated files, and data lake content.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-glacier
    name: Amazon Glacier
    description: Archive storage shown as part of the data lake in the architecture diagram; its specific role is not described in the accompanying text.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/storage-classes/glacier/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-timestream
    name: Amazon Timestream
    description: Stores telemetry for historical analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/timestream/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue
    name: AWS Glue
    description: Performs extract, transform, and load (ETL) processing on data in the data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-athena
    name: Amazon Athena
    description: Queries data lake content for analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes analytics insights for business users.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Trains machine-learning models and deploys them to the edge for inferencing with AWS IoT Greengrass.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-events
    name: AWS IoT Events
    description: Detects complex events from connected-device data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-events/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sns
    name: Amazon Simple Notification Service (Amazon SNS)
    description: Publishes notifications for events detected by AWS IoT Events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-freertos
    name: Amazon FreeRTOS
    description: An option shown for software running on medical devices in small clinics or homes.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/freertos/
    types: [library]
  - key: aws-iot-device-sdk
    name: AWS IoT Device SDK
    description: An alternative shown for connecting medical devices in small clinics or homes to AWS IoT.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot/latest/developerguide/iot-sdks.html
    types: [library]
  - key: mqtt
    name: MQTT
    description: Messaging protocol identified in the diagram for telemetry and device connectivity.
    vendor: OASIS Open
    url: https://mqtt.org/
    types: [third-party]
  - key: https
    name: HTTPS
    description: Protocol identified in the diagram for device connectivity.
    vendor: Internet Engineering Task Force
    url: https://www.rfc-editor.org/rfc/rfc9110
    types: [third-party]
  - key: manufacturer-hosted-pki
    name: Manufacturer-hosted PKI services
    description: External public key infrastructure services hosted by the device manufacturer, as referenced in the diagram.
    types: [third-party]
  - key: third-party-apis
    name: Third-party APIs
    description: External endpoints accessed through Amazon API Gateway; the source does not identify their providers.
    types: [third-party]
