technologies:
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Edge runtime configured with connectors for factory machines and deployment of the predictive-maintenance model.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/greengrass/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-core
    name: AWS IoT Core
    description: Ingests factory MQTT topics and routes them with rules to data streaming services.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-data-firehose
    name: Amazon Data Firehose
    description: Delivery streams send factory and stream-analytics data to the Amazon S3 data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Object storage for the factory-data lake and data connected with SageMaker AI.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Builds the predictive-maintenance machine-learning model and connects with the S3 data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/ai/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-athena
    name: Amazon Athena
    description: Queries the S3 data lake using metadata in the AWS Glue Data Catalog.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Catalog metadata used by Amazon Athena when querying the data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes analysis from the Amazon Athena data source.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Streams AWS IoT Core messages to the anomaly-detection application.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-managed-service-for-apache-flink
    name: Amazon Managed Service for Apache Flink
    description: Runs the streaming anomaly-detection application and connects its output to Firehose and Lambda.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/managed-service-apache-flink/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Handles anomaly-detection output before notifications are published to Amazon SNS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Publishes anomaly notifications from AWS Lambda.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: mqtt
    name: MQTT
    description: Messaging protocol used for the AWS IoT Core topics; the source does not specify topic schemas or versions.
    vendor: OASIS Open
    url: https://mqtt.org/
    types: [third-party]
