# Technology keys used in architecture.c4 and the optional technologies described by the source.
technologies:
  - key: aws-iot-core
    name: AWS IoT Core
    description: Receives asset position messages and uses IoT rules and thing models to process devices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-location-service
    name: Amazon Location Service
    description: Location Tracker stores device positions and evaluates them against an associated Geofence Collection.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/location/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-eventbridge
    name: Amazon EventBridge
    description: Receives geofence enter and exit events on the default event bus and routes them to targets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eventbridge/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs functions invoked by IoT rules and EventBridge to update trackers and process geofence events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-events
    name: AWS IoT Events
    description: Optionally detects complex events from raw geofence events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-events/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-timestream
    name: Amazon Timestream
    description: Optional time-series store for event history when complex event detection is used.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/timestream/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Publishes geofence notifications to an SNS topic for end users.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Optional edge software path for publishing asset locations to AWS IoT Core.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/greengrass/
    types: [compute-platform]
    platform: other
    hosts: [system]
  - key: bluetooth-low-energy
    name: Bluetooth Low Energy
    description: Source location method for the warehouse example; the source does not specify a tag or gateway vendor.
    vendor: Bluetooth SIG
    url: https://www.bluetooth.com/learn-about-bluetooth/tech-overview/
    types: [third-party]
  - key: gps
    name: GPS
    description: Alternative source of asset coordinates for outdoor deployments.
    types: [third-party]
