# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Edge runtime shown with northbound and southbound connectors, stream analytics, and ML inference.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/greengrass/v2/developerguide/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-iot-core
    name: AWS IoT Core
    description: Edge-to-cloud interface that ingests industrial telemetry.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot/latest/developerguide/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-sitewise
    name: AWS IoT SiteWise
    description: Edge-to-cloud interface for ingesting industrial telemetry and supporting equipment monitoring.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot-sitewise/latest/userguide/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-firehose
    name: Amazon Kinesis Data Firehose
    description: Warm-path streaming service shown before and after the anomaly-query stage.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-managed-service-for-apache-flink
    name: Amazon Managed Service for Apache Flink
    description: Runs streaming queries for warm-path anomaly detection; the diagram uses the former name Amazon Kinesis Data Analytics.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-s3
    name: Amazon S3
    description: Data lake for raw and processed telemetry, trained models, and inference results.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: One of the documented alternatives for training ML models and running cold-path batch inference.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-lookout-for-equipment
    name: Amazon Lookout for Equipment
    description: Alternative documented by AWS to train ML models and run cold-path batch inference.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/lookout-for-equipment/latest/ug/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs functions that analyze batch inference results.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/lambda/latest/dg/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Database service shown in the cold-analysis path; AWS does not specify its table contents or exact role.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-athena
    name: Amazon Athena
    description: Query service shown in the cold-analysis path; AWS does not specify its queries or exact data flow.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/athena/latest/ug/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sns
    name: Amazon SNS
    description: Notification service through which OT teams can receive email, text, or ticketing-integration alerts.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/sns/latest/dg/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-sitewise-monitor
    name: AWS IoT SiteWise Monitor
    description: No-code dashboards for assessing real-time and historical equipment performance.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot-sitewise/latest/userguide/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Evaluates anomaly history and fleet performance.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/quicksight/latest/user/welcome.html
    types: [managed-service]
    platform: aws
    hosts: []
