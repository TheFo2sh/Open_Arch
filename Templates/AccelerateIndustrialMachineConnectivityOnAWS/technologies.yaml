technologies:
  - key: eot-twin-talk-express
    name: EOT Twin Talk Express
    description: Embassy of Things data-sharing platform that connects supported industrial historians and provides sensor data and asset models.
    vendor: Embassy of Things
    url: https://embassyofthings.com/twintalk/
    types: [third-party]
  - key: osisoft-pi
    name: OSIsoft PI
    description: Industrial historian identified by AWS as a source of real-time device and sensor data.
    vendor: OSIsoft
    types: [third-party]
  - key: cygnet-scada
    name: CygNet SCADA
    description: SCADA platform identified by AWS as a source of real-time device and sensor data.
    types: [third-party]
  - key: amazon-s3
    name: Amazon S3
    description: Stores incoming enriched asset-model files and the industrial data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Normalizes incoming asset-model files and creates or updates assets in AWS IoT SiteWise.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores normalized asset models and definitions; DynamoDB Streams triggers asset updates.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-sitewise
    name: AWS IoT SiteWise
    description: Ingests and processes industrial sensor data and stores asset models and property data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-sitewise/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-iot-core
    name: AWS IoT Core
    description: Receives MQTT asset-property update messages and routes them with an IoT rule.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-data-firehose
    name: Amazon Data Firehose
    description: Captures, transforms, and delivers asset-property update data to Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
