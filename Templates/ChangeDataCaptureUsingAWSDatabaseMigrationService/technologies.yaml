# The technologies the blueprint uses, by the key its metadata { uses } names them by.
technologies:
  - key: aws-dms
    name: AWS Database Migration Service
    description: Migrates databases and captures ongoing changes for replication or streaming.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dms/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-schema-conversion-tool
    name: AWS Schema Conversion Tool
    description: Tool that converts source schemas and code objects for heterogeneous migrations.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/Welcome.html
    types: [library]
  - key: amazon-aurora
    name: Amazon Aurora
    description: AWS relational database option shown as a CDC source or target.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/aurora/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-documentdb
    name: Amazon DocumentDB
    description: AWS document database option shown as a CDC source or target.
