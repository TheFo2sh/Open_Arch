# The technologies used by the blueprint, keyed by its metadata { uses } values.
technologies:
  - key: amazon-route-53
    name: Amazon Route 53
    description: Provides DNS configuration for the Magento store.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/route53/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-waf
    name: AWS WAF
    description: Protects Magento against common web exploits.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/waf/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-cloudfront
    name: Amazon CloudFront
    description: Content delivery network for static and dynamic Magento web content.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudfront/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: Application Load Balancer distributes traffic across Varnish pods through Kubernetes ingress.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-eks
    name: Amazon Elastic Kubernetes Service
    description: Managed Kubernetes platform that runs the Varnish and Magento pods across Availability Zones.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eks/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ecr
    name: Amazon Elastic Container Registry
    description: Hosts the container images for Varnish and Magento.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ecr/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-opensearch-service
    name: Amazon OpenSearch Service
    description: Managed search for the Magento product catalog.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/opensearch-service/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-elasticache-redis
    name: Amazon ElastiCache for Redis
    description: Redis caching layer for the Magento application and database.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticache/redis/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-aurora
    name: Amazon Aurora
    description: Relational database option for Magento, shown with a primary and replica.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/aurora/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-efs
    name: Amazon Elastic File System
    description: Shared configuration for Varnish and shared media assets for Magento pods.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/efs/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores historical user data exported by the Amazon Personalize extension for Magento.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-personalize
    name: Amazon Personalize
    description: Trains a private recommendation model and hosts its activated solution and campaign in the AWS account.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/personalize/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: varnish-cache-enterprise
    name: Varnish Cache Enterprise
    description: Varnish Cache enterprise version used for the full-page cache pods.
    vendor: Varnish Software
    url: https://www.varnish-software.com/products/varnish-enterprise/
    types: [library, third-party]
  - key: magento-commerce
    name: Magento Open Source or Adobe Commerce
    description: Magento e-commerce application; the source allows either the Open Source or Commerce edition.
    vendor: Adobe
    url: https://business.adobe.com/products/magento.html
    types: [library, third-party]
  - key: nginx
    name: Nginx
    description: Web server included in each Magento pod.
    vendor: F5
    url: https://nginx.org/
    types: [library]
  - key: php
    name: PHP
    description: Application runtime included in each Magento pod.
    vendor: The PHP Group
    url: https://www.php.net/
    types: [library]
  - key: amazon-personalize-magento-extension
    name: Amazon Personalize extension for Magento
    description: Exports historical user data and exchanges real-time interaction indicators and recommendations with Amazon Personalize.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/personalize/latest/dg/
    types: [library]
