technologies:
  - key: amazon-vpc
    name: Amazon VPC
    description: Isolated network boundary for the application and its private resources.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
