# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Push notification providers are listed as external dependencies; AWS does not specify their APIs.
technologies:
  - key: amazon-vpc
    name: Amazon VPC
    description: Network boundary shown around the multi-AZ game backend and its private data tiers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2
    name: Amazon EC2
    description: Compute platform for the web and application servers in the game backend.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2-auto-scaling
    name: Amazon EC2 Auto Scaling
    description: Runs the game servers in an Auto Scaling group across multiple Availability Zones.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/autoscaling/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: Public and optional internal load balancers distribute requests to the web and application tiers; the public load balancer terminates HTTPS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-internet-gateway
    name: Internet Gateway
    description: Internet connectivity boundary depicted for the VPC.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-vpc-nat-gateway
    name: Amazon VPC NAT Gateway
    description: NAT gateways depicted in the public subnets; their exact routing configuration is not specified.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/features/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3-vpc-endpoint
    name: Amazon S3 VPC endpoint
    description: Endpoint labeled for Amazon S3 in the VPC diagram.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-route-53
    name: Amazon Route 53
    description: Helps players discover game service endpoints and supports latency- or geography-based routing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/route53/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-elasticache-redis
    name: Amazon ElastiCache for Redis
    description: Managed Redis cache shown as a primary and secondary across Availability Zones; AWS describes Multi-AZ failover and read replicas.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticache/redis/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-aurora
    name: Amazon Aurora
    description: MySQL-compatible relational database with a main instance and read replicas across Availability Zones.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rds/aurora/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Managed NoSQL database for predictable performance and scalability.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon S3
    description: Stores game assets, downloadable content, and logs generated by game servers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-cloudfront
    name: Amazon CloudFront
    description: Globally distributed content cache for game assets and other content stored in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudfront/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service (Amazon SNS)
    description: Sends push notifications with support for Apple, Google, Amazon, and Windows platforms.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: apple-push-notification-platform
    name: Apple push-notification platform
    description: External push-notification channel listed as supported by Amazon SNS; AWS does not identify a specific integration or API here.
    vendor: Apple
    types: [third-party]
  - key: google-push-notification-platform
    name: Google push-notification platform
    description: External push-notification channel listed as supported by Amazon SNS; AWS does not identify a specific integration or API here.
    vendor: Google
    types: [third-party]
  - key: amazon-push-notification-platform
    name: Amazon push-notification platform
    description: External push-notification channel listed as supported by Amazon SNS; AWS does not identify a specific integration or API here.
    vendor: Amazon
    types: [third-party]
  - key: windows-push-notification-platform
    name: Windows push-notification platform
    description: External push-notification channel listed as supported by Amazon SNS; AWS does not identify a specific integration or API here.
    vendor: Microsoft
    types: [third-party]
