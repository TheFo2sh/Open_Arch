technologies:
  - key: amazon-cognito
    name: Amazon Cognito
    description: User pools authenticate users and administrators accessing the inference REST API.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cognito/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Exposes the REST API used to create jobs, monitor them, and retrieve results.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the API functions for creating, cancelling, monitoring, and retrieving inference jobs.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Stores submitted input objects and the aggregated inference results.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores job tracking records and metadata for the model endpoints used by the workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb-streams
    name: Amazon DynamoDB Streams
    description: Publishes changes to the job table so a new job item can trigger the inference workflow.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestrates the inference workflow, including parallel endpoint invocation and result aggregation.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Hosts category-specific model endpoints invoked by the inference workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
