# The AWS services used by the three reference architectures.
technologies:
  - key: aws-data-sync
    name: AWS DataSync
    description: Transfers on-premises or cloud data sources into AWS for near real-time ingestion.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/datasync/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-database-migration-service
    name: AWS Database Migration Service
    description: Migrates source databases into AWS as part of payor data ingestion.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dms/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores raw, curated, atomic, document, data-lake, and call-log objects.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs shorter data-curation and referential-integrity jobs and initiates AWS Glue processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-glue
    name: AWS Glue
    description: Runs Spark ETL jobs and provides crawlers for discovering data sources and targets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-redshift
    name: Amazon Redshift
    description: Stores curated and atomic payor datasets for analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
