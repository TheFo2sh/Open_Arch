# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-cognito
    name: Amazon Cognito
    description: Identity pool that supplies temporary AWS credentials for game clients using the AWS SDK ingestion option.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cognito/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Optional REST API entry point with a native integration to Kinesis Data Streams.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Receives JSON game events from clients and game servers and feeds the real-time and batch processing paths.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-managed-service-for-apache-flink
    name: Amazon Managed Service for Apache Flink
    description: Runs real-time SQL queries to analyze, filter, and process the Kinesis stream; labeled Kinesis Data Analytics in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/managed-service-apache-flink/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the function that publishes real-time custom metrics and the optional Firehose data transformation function.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: Receives custom game metrics and supports real-time dashboards, alerts, and notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Optional notification path for CloudWatch alerts and notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-data-firehose
    name: Amazon Data Firehose
    description: Consumes the game-event stream, optionally transforms records with its Lambda integration, and batches data for S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores the processed game events as the data lake for batch and ad hoc analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-athena
    name: Amazon Athena
    description: Queries game analytics data in S3 on an ad hoc basis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes query results to provide business insights.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-sdk-for-dotnet
    name: AWS SDK for .NET
    description: One AWS SDK option for a Unity game client to submit events directly to Kinesis Data Streams.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/developer/tools/
    types: [library]
  - key: aws-sdk-for-cpp
    name: AWS SDK for C++
    description: One AWS SDK option for an Unreal Engine game client to submit events directly to Kinesis Data Streams.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/developer/tools/
    types: [library]
  - key: unity
    name: Unity
    description: Example game engine named by AWS when describing the .NET SDK option for client event collection.
    vendor: Unity Technologies
    url: https://unity.com/
    types: [third-party]
  - key: unreal-engine
    name: Unreal Engine
    description: Example game engine named by AWS when describing the C++ SDK option for client event collection.
    vendor: Epic Games
    url: https://www.unrealengine.com/
    types: [third-party]
