# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-connect
    name: Amazon Connect
    description: Cloud contact center for natural-language IVR, contact flows, skills-based routing, and agent interactions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/connect/
    types: [managed-service]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-connect-contact-lens
    name: Amazon Connect Contact Lens
    description: Amazon Connect feature that provides real-time sentiment analysis, transcripts, and detailed contact analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/connect/contact-lens/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-appflow
    name: Amazon AppFlow
    description: Retrieves customer profile data such as name, membership status, and loyalty points from a CRM for Amazon Connect.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/appflow/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-kinesis
    name: Amazon Kinesis
    description: Streams Amazon Connect contact metadata for near-real-time processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon S3
    description: Stores completed-call recordings and data used by the contact center analytics flow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-redshift
    name: Amazon Redshift
    description: Data warehouse that ingests stored contact data for analysis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes contact center analytics in dashboards.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Exposes retailer capabilities as APIs for contact center business-system integrations.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs business logic for API integrations and low-latency lookups.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: NoSQL datastore for low-latency lookups made directly from API Gateway.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: salesforce-crm
    name: Salesforce CRM
    description: Example third-party CRM named by AWS; the architecture also allows another CRM provider.
    vendor: Salesforce
    url: https://www.salesforce.com/crm/
    types: [third-party]
