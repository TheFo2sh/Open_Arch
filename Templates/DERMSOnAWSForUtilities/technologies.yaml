    name: AWS Storage Gateway
    description: Hybrid storage service shown as an ingress option in the reference diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/storagegateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-services
