# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: aws-iot-core
    name: AWS IoT Core
    description: Connects vehicles to AWS and routes messages through rules and actions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-core/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-device-management
    name: AWS IoT Device Management
    description: Onboards connected vehicles and manages their lifecycle.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-device-management/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-device-shadow
    name: AWS IoT Device Shadow
    description: Maintains device state for remote operations in the connected-vehicle architecture.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot/latest/developerguide/iot-device-shadows.html
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-fleetwise
    name: AWS IoT FleetWise
    description: Collects vehicle data through its edge agent and sends it to the cloud.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot-fleetwise/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-iot-greengrass
    name: AWS IoT Greengrass
    description: Edge runtime shown hosting vehicle components, including machine-learning inference.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/greengrass/
    types: [compute-platform]
    platform: other
    hosts: [system]
  - key: aws-iot-fleetwise-edge-agent
    name: AWS IoT FleetWise Edge Agent
    description: Vehicle-side software that collects and sends selected vehicle data.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-agent.html
    types: [library]
  - key: aws-iot-sdk
    name: AWS IoT Device SDK
    description: Device-side SDK used by connected-vehicle software to communicate with AWS IoT.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/iot/device-sdk/
    types: [library]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs functions shown in the vehicle-management, notification, and fleet-management flows.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-eventbridge
    name: Amazon EventBridge
    description: Coordinates vehicle attribute and subscription management events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eventbridge/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-neptune
    name: Amazon Neptune
    description: Graph database integrated with vehicle attribute and subscription management.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/neptune/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Streams vehicle data for aggregation into trip information and driver scores.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-firehose
    name: Amazon Data Firehose
    description: The diagram labels this Amazon Kinesis Data Firehose; it delivers vehicle data to the raw, curated, and anonymized data lake on Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/firehose/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Stores raw, curated, and anonymized mobility data and fleet-portal assets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-lake-formation
    name: AWS Lake Formation
    description: Governs the connected-mobility data lake.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lake-formation/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores aggregated trip information, driver scores, and fleet-management data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-timestream
    name: Amazon Timestream
    description: Stores vehicle telemetry time-series data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/timestream/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Exposes service and data APIs and provides the fleet portal API.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-data-exchange
    name: AWS Data Exchange
    description: Provides data APIs for internal and external connected-mobility use.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/data-exchange/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-managed-service-for-apache-flink
    name: Amazon Managed Service for Apache Flink
    description: Generates near-real-time alerts and insights; the diagram labels the analytics service Amazon Kinesis Data Analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/managed-service-apache-flink/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-video-streams
    name: Amazon Kinesis Video Streams
    description: Supplies video streams for personalization and recognition use cases.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/video-streams/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-rekognition
    name: Amazon Rekognition
    description: Supports video recognition and personalization use cases.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rekognition/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Develops custom models for preventive and predictive use cases.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/ai/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sns
    name: Amazon Simple Notification Service (Amazon SNS)
    description: Publishes notifications generated from mobility alerts and insights.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-location-service
    name: Amazon Location Service
    description: Provides location capabilities for the fleet-management portal.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/location/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-connect
    name: Amazon Connect
    description: Enables connected-mobility call-center workflows.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/connect/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-chime
    name: Amazon Chime
    description: Communications service shown integrated with the connected-mobility call center.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/chime/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-comprehend
    name: Amazon Comprehend
    description: Language-analysis service shown in the assistance and call-center integration.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/comprehend/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Visualizes call insights.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
