    description: Industrial connectivity protocol supported by AWS IoT Greengrass connectors.
    vendor: OPC Foundation
    url: https://opcfoundation.org/about/opc-technologies/opc-ua/
    types: [third-party]
  - key: modbus-tcp
    name: Modbus TCP
    description: Industrial connectivity protocol supported by AWS IoT Greengrass connectors.
    url: https://www.modbus.org/
    types: [third-party]
  - key: modbus-rtu
    name: Modbus RTU
    description: Industrial connectivity protocol supported by AWS IoT Greengrass connectors.
    url: https://www.modbus.org/
    types: [third-party]
  - key: ethernet-ip
    name: EtherNet/IP
    description: Industrial connectivity protocol supported by AWS IoT Greengrass connectors.
    vendor: ODVA
    url: https://www.odva.org/technology-standards/key-technologies/ethernet-ip/
