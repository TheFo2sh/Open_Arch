# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: tulip-frontline-operations-platform
    name: Tulip Frontline Operations Platform
    description: Tulip's SaaS no-code environment for creating frontline operations applications.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-edge-io
    name: Tulip Edge IO
    description: On-premises device that connects barcode scanners, cameras, printers, and scales to Tulip.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-connector-host
    name: Tulip Connector Host
    description: On-premises host for Tulip connectors that connect to local devices and systems.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-player
    name: Tulip Player
    description: Tulip application player used by factory operators.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-connectors
    name: Tulip Connectors
    description: Interfaces used to ingest data into Tulip applications.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-sql-connector
    name: Tulip SQL Connector
    description: Tulip connector shown integrating the platform with SQL databases.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-rest-connector
    name: Tulip REST Connector
    description: Tulip connector shown integrating the platform with SaaS applications.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
  - key: tulip-api
    name: Tulip API
    description: Tulip API shown alongside the platform's SQL and REST connectors.
    vendor: Tulip Interfaces
    url: https://tulip.co/
    types: [third-party]
