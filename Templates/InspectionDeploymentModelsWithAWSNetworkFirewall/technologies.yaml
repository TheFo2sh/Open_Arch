# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-vpc
    name: Amazon VPC
    description: Isolated virtual networks that contain workload, inspection, ingress, and egress resources in the documented patterns.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-network-firewall
    name: AWS Network Firewall
    description: Managed network firewall that transparently inspects routed traffic at a firewall endpoint within a VPC.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-internet-gateway
    name: AWS Internet Gateway
    description: Connects a VPC to the internet for the documented inbound and outbound traffic patterns.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-application-load-balancer
    name: AWS Application Load Balancer
    description: Receives inbound application traffic in the single-VPC and centralized-ingress patterns.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-nat-gateway
    name: AWS NAT Gateway
    description: Translates private workload addresses for internet-bound traffic in the single-VPC and centralized-egress patterns.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-transit-gateway
    name: AWS Transit Gateway
    description: Routes traffic between VPCs and, through inter-Region peering, between Regions in the centralized inspection patterns.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2
    name: Amazon EC2
    description: Compute platform for the workload instances shown in the inspection patterns.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
