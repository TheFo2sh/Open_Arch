# The technologies the blueprint uses, by the key its metadata { uses } names them by.
# Applying the template adds the ones the project's technology catalogs lack.
technologies:
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Stores submitted documents for the workflow and is the source of the S3 event that starts processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestrates the document-processing workflow started by an Amazon S3 event.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Runs the document extraction, embedding coordination, similarity assessment, and event-publishing functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: apache-tika
    name: Apache Tika
    description: Third-party content-analysis toolkit used by a Lambda function to extract text and metadata from submitted documents.
    vendor: The Apache Software Foundation
    url: https://tika.apache.org/
    types: [library]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Hosts the pre-trained BERT-based model that returns word-embedding vectors for document paragraphs.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: bert-based-model
    name: Pre-trained BERT-based model
    description: Generates word-embedding vectors; AWS does not specify the model publisher, variant, or serving configuration.
    types: [library]
  - key: amazon-vpc
    name: Amazon Virtual Private Cloud
    description: Network boundary shown around the similarity-search Lambda function and Amazon OpenSearch Service domain.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpc/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-opensearch-service
    name: Amazon OpenSearch Service
    description: Stores the indexed pre-processed works and performs the K-Nearest Neighbor similarity search.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/opensearch-service/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-eventbridge
    name: Amazon EventBridge
    description: Receives an event for a source document that may have been plagiarized and its relevant matching works.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/eventbridge/
    types: [managed-service]
    platform: aws
    hosts: []
