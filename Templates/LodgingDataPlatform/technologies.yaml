# The AWS services shown in the Lodging Data Platform reference architecture.
technologies:
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Object storage for the data lake, including real-time and batch staging, curated Parquet data, and reportable data sets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Purpose-built operational data store used for lodging data and customer 360 data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-lambda
    name: AWS Lambda
    description: Serverless compute used with Step Functions for customer event processing and operational microservices.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Workflow orchestration for operational microservices and customer event processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-fargate
    name: AWS Fargate
    description: Serverless container compute shown alongside Lambda in customer event processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/fargate/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: API entry point for lodging customer and service API clients.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Streaming event ingestion from lodging systems of record.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: aws-transfer-family
    name: AWS Transfer Family
    description: Managed file-transfer ingestion path for batch data.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/aws-transfer-family/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-data-exchange
    name: AWS Data Exchange
    description: Data subscription and exchange source shown for batch ingestion.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/data-exchange/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-appflow
    name: Amazon AppFlow
    description: Managed data-flow service shown as a batch ingestion path.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/appflow/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-glue
    name: AWS Glue
    description: Data integration and transformation service for processing data lake datasets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-emr
    name: Amazon EMR
    description: Managed big-data processing service shown for data lake transformations.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/emr/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-glue-data-catalog
    name: AWS Glue Data Catalog
    description: Data catalog shown alongside AWS Glue for publishing and discovering lake datasets.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, data-platform]
    platform: aws
    hosts: []
  - key: amazon-redshift
    name: Amazon Redshift
    description: Data warehouse for enterprise schemas and data marts serving known analytics patterns.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-athena
    name: Amazon Athena
    description: Serverless analysis of data in the data lake for one-time requirements.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: AI and machine learning service for customer segmentation, lifetime value, and custom models.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Customer analytics and dashboards for lodging data users.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
    hosts: []
