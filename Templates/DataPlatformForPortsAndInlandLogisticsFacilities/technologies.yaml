# Technology catalog for the AWS services shown in the reference architecture.
technologies:
  - key: aws-direct-connect
    name: AWS Direct Connect
    description: Dedicated network connectivity shown between port facilities and AWS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/directconnect/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
