# The AWS services and model used by the blueprint, by the key its metadata { uses } names them by.
technologies:
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Accepts content-discovery requests and serves category lookups to bidding servers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Orchestrates the serverless crawler, content-discovery controller, and analysis workflows.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs content discovery, analysis, and category-service functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Publishes discovery-completion and content-analysis events.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores ephemeral discovery data, content metadata, analysis results, and mapped categories.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon S3
    description: Stores discovered content for analysis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-comprehend
    name: Amazon Comprehend
    description: Extracts topics and sentiment from discovered content.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/comprehend/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-rekognition
    name: Amazon Rekognition
    description: Analyzes images and video in discovered content.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/rekognition/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-transcribe
    name: Amazon Transcribe
    description: Processes audio content as part of content analysis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/transcribe/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-sagemaker-ai
    name: Amazon SageMaker AI
    description: Hosts the Contextual Intelligence Taxonomy Mapper and its BERT model.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: bert-model
    name: Bidirectional Encoder Representations from Transformers (BERT)
    description: The model used by the Contextual Intelligence Taxonomy Mapper to map analyzed metadata to a taxonomy.
    vendor: Google
    url: https://arxiv.org/abs/1810.04805
    types: [library]
