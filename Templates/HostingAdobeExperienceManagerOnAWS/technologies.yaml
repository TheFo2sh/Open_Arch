# Technologies named by the blueprint or called out as optional in the source.
technologies:
  - key: amazon-route-53
    name: Amazon Route 53
    description: DNS service that provides DNS configuration for the AEM deployment.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/route53/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-waf
    name: AWS WAF
    description: Web application firewall that protects AEM against common web exploits.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/waf/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudfront
    name: Amazon CloudFront
    description: Content delivery network that accelerates delivery of static and dynamic web content.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudfront/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-certificate-manager
    name: AWS Certificate Manager
    description: Provisions, manages, and deploys public and private SSL certificates for AEM.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/certificate-manager/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: elastic-load-balancing
    name: Elastic Load Balancing
    description: Application Load Balancers distribute requests to the publish dispatcher tier and, optionally, the author dispatcher tier.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/elasticloadbalancing/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-ec2-auto-scaling
    name: Amazon EC2 Auto Scaling
    description: Scaling groups for the EC2 instances in the AEM deployment.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/autoscaling/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-ec2
    name: Amazon EC2
    description: Compute instances that run the AEM author, publish, and dispatcher tiers.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs scaling logic and automates dispatcher-publish pairing, replication-agent updates, and author failover logic.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Preferred shared datastore for binary content used by AEM publish and author instances.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-ebs
    name: Amazon Elastic Block Store
    description: Block storage used for the preferred TarMK node store on AEM author.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ebs/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: adobe-experience-manager
    name: Adobe Experience Manager
    description: Adobe's content management system, deployed as author and publish installations.
    vendor: Adobe
    url: https://business.adobe.com/products/experience-manager/adobe-experience-manager.html
    types: [library]
  - key: adobe-tarmk
    name: Adobe TarMK
    description: Tar storage node store used by AEM publish and preferred for AEM author.
    vendor: Adobe
    url: https://experienceleague.adobe.com/en/docs/experience-manager-65/content/implementing/deploying/deploying/data-store-config
    types: [library]
  - key: aem-dispatcher
    name: AEM Dispatcher
    description: Apache httpd-based AEM web tier that provides caching, load balancing, and application security.
    vendor: Adobe
    url: https://experienceleague.adobe.com/en/docs/experience-manager-dispatcher/using/dispatcher
    types: [library]
  - key: apache-http-server
    name: Apache HTTP Server
    description: HTTP server underlying the AEM Dispatcher.
    vendor: Apache Software Foundation
    url: https://httpd.apache.org/
    types: [library]
  - key: mongodb
    name: MongoDB
    description: Optional node-store alternative AWS mentions for scaling AEM author; deployment and configuration details are not specified.
    vendor: MongoDB, Inc.
    url: https://www.mongodb.com/
    types: [third-party]
