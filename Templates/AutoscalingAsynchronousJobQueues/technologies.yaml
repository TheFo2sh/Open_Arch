# Technologies named in the AWS reference page and diagram.
technologies:
  - key: amazon-api-gateway
    name: Amazon API Gateway
    description: Provides the interface for adding, querying, and canceling jobs.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/api-gateway/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-lambda
    name: AWS Lambda
    description: Creates job records and provides the query and cancel control functions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-sqs
    name: Amazon Simple Queue Service
    description: Holds job IDs until the corresponding workers process them; each job type has a queue.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sqs/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: Monitors each job queue and provides alarms for queue depth and empty queues.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-ecs
    name: Amazon Elastic Container Service
    description: Responds to CloudWatch alarms by changing the desired count and scaling parallel jobs for each job type.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ecs/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: aws-fargate
    name: AWS Fargate
    description: Runs the job processing containers that poll queues and process job records.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/fargate/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores each job's state, parameters, and results by job ID.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-ecr
    name: Amazon Elastic Container Registry
    description: Stores the job processing container images used by AWS Fargate.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ecr/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Publishes job items to subscribers when job state changes.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
