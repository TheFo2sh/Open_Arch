# The technologies the blueprint uses, by the key its metadata { uses } names them by.
technologies:
  - key: amazon-sqs
    name: Amazon Simple Queue Service
    description: Decouples HPC job submission from worker execution with a queue polled by the workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sqs/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-step-functions
    name: AWS Step Functions
    description: Starts a workflow for a tagged EC2 instance, polls its SQS job queue, runs jobs, and records their status.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/step-functions/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2
    name: Amazon Elastic Compute Cloud
    description: Runs the EC2 instances or instance clusters that execute HPC jobs.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-cloudwatch-events
    name: Amazon CloudWatch Events
    description: Detects EC2 instance launches and triggers the scheduler's Lambda function.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-lambda
    name: AWS Lambda
    description: Starts Step Functions for newly launched workers and handles S3 job submissions and worker scaling.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Stores job status written by the workflow.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: aws-systems-manager-run-command
    name: AWS Systems Manager Run Command
    description: Provides the command interface used to submit jobs to Amazon SQS.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/systems-manager/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-s3
    name: Amazon Simple Storage Service
    description: Stores job input files and executables, triggers job creation, and stores results in the S3-based extension.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
  - key: amazon-ec2-auto-scaling
    name: Amazon EC2 Auto Scaling
    description: Scales the number of HPC worker instances from zero to a configured maximum.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/ec2/autoscaling/
    types: [managed-service]
    platform: aws
    hosts: []
    packages: [{manager: terraform, name: hashicorp/aws}]
