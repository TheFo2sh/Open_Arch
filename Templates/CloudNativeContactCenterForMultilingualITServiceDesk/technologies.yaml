# Technologies named in the blueprint, by the key its metadata { uses } names them by.
technologies:
  - key: amazon-connect
    name: Amazon Connect
    description: Omnichannel contact center for inbound and outbound voice, web and mobile chat, skills-based routing, contact flows, queues, and agent metrics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/connect/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Runs custom CRM or ITSM integrations, Lex bot functions, and contact trace record processing.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-lex
    name: Amazon Lex
    description: Conversational bot service integrated with Amazon Connect for automated service desk contacts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lex/
    types: [managed-service]
    platform: aws
    hosts: [system]
  - key: amazon-dynamodb
    name: Amazon DynamoDB
    description: Database shown with the conversational bot support channel; the source does not specify its schema or exact use.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/dynamodb/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-s3
    name: Amazon Simple Storage Service (Amazon S3)
    description: Stores call recordings and the additional text-analysis and analytics data stores shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-transcribe
    name: Amazon Transcribe
    description: Converts recorded speech to text for downstream analysis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/transcribe/
    types: [managed-service]
    platform: aws
  - key: amazon-translate
    name: Amazon Translate
    description: Translates text associated with recorded contacts; language pairs and translation workflow are not specified.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/translate/
    types: [managed-service]
    platform: aws
  - key: amazon-comprehend
    name: Amazon Comprehend
    description: Analyzes contact text for key topics and sentiment.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/comprehend/
    types: [managed-service]
    platform: aws
  - key: amazon-macie
    name: Amazon Macie
    description: Protects sensitive data in call recordings stored in Amazon S3.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/macie/
    types: [managed-service]
    platform: aws
  - key: amazon-athena
    name: Amazon Athena
    description: Analyzes relationships in converted contact text.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/athena/
    types: [managed-service]
    platform: aws
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Streams Amazon Connect metrics and contact trace records for analysis.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service]
    platform: aws
  - key: amazon-kinesis-data-firehose
    name: Amazon Kinesis Data Firehose
    description: Delivers processed contact analytics data to the stores shown in the diagram.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-firehose/
    types: [managed-service]
    platform: aws
  - key: amazon-redshift
    name: Amazon Redshift
    description: Data warehouse for contact trace record analytics.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/redshift/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-quicksight
    name: Amazon QuickSight
    description: Displays contact analytics and reporting dashboards.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/quicksight/
    types: [managed-service]
    platform: aws
  - key: amazon-sms-events
    name: Amazon SMS Events
    description: Diagram label for the SMS event source in the conversational bot channel; AWS does not identify a specific SMS product or event integration.
    vendor: Amazon Web Services
    types: [managed-service]
    platform: aws
  - key: aws-direct-connect
    name: AWS Direct Connect
    description: Customer connectivity service shown at the customer-location boundary; the diagram does not specify its routing or target resources.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/directconnect/
    types: [managed-service]
    platform: aws
  - key: aws-site-to-site-vpn
    name: AWS Site-to-Site VPN
    description: VPN connectivity shown between the customer location and AWS; the specific topology is not described.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/vpn/
    types: [managed-service]
    platform: aws
  - key: aws-internet-gateway
    name: Internet Gateway
    description: Internet gateway shown in the architecture diagram; its VPC and routing configuration are not specified.
    vendor: Amazon Web Services
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
    types: [managed-service]
    platform: aws
  - key: servicenow
    name: ServiceNow
    description: Third-party ITSM ticketing system shown as an integration example, not a required product.
    vendor: ServiceNow
    url: https://www.servicenow.com/
    types: [third-party]
  - key: salesforce
    name: Salesforce
    description: Third-party CRM integration example mentioned in the Amazon Connect documentation.
    vendor: Salesforce
    url: https://www.salesforce.com/
    types: [third-party]
  - key: zendesk
    name: Zendesk
    description: Third-party CRM integration example mentioned in the Amazon Connect documentation.
    vendor: Zendesk
    url: https://www.zendesk.com/
    types: [third-party]
