technologies:
  - key: amazon-kinesis-data-streams
    name: Amazon Kinesis Data Streams
    description: Managed streaming service for observations entering the anomaly detection pipeline.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/kinesis/data-streams/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: amazon-s3
    name: Amazon S3
    description: Object storage for source observations, prepared data and model artifacts.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/s3/
    types: [managed-service, data-platform]
    platform: aws
    hosts: [database]
  - key: aws-glue
    name: AWS Glue
    description: Managed data integration service for preparing observations for model training.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/glue/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-sagemaker
    name: Amazon SageMaker
    description: Managed machine-learning platform for training and serving the anomaly detection model.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sagemaker/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: aws-lambda
    name: AWS Lambda
    description: Serverless compute for processing scoring results and triggering downstream actions.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/lambda/
    types: [managed-service, compute-platform]
    platform: aws
    hosts: [system]
  - key: amazon-sns
    name: Amazon Simple Notification Service
    description: Managed messaging service for delivering anomaly notifications.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/sns/
    types: [managed-service]
    platform: aws
    hosts: []
  - key: amazon-cloudwatch
    name: Amazon CloudWatch
    description: Monitoring service for pipeline metrics and anomaly-related alarms.
    vendor: Amazon Web Services
    url: https://aws.amazon.com/cloudwatch/
    types: [managed-service]
    platform: aws
    hosts: []
